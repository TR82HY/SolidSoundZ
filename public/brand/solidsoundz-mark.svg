<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="mark-title mark-description">
  <title id="mark-title">SolidSoundZ</title>
  <desc id="mark-description">A fixed neon-green Z over a spinning DJ record, with orbital rings on a rounded dark background.</desc>
  <style>
    .ssz-disc { transform-box: fill-box; transform-origin: center; animation: ssz-record-spin 8s linear infinite; }
    @keyframes ssz-record-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .ssz-disc { animation: none; } }
  </style>
  <rect width="64" height="64" rx="14" fill="#090a0a"/>
  <g class="ssz-disc">
    <circle cx="32" cy="32" r="27" fill="#111413" stroke="#596255" stroke-width="1.5"/>
    <g fill="none" stroke="#465044" stroke-width="1">
      <circle cx="32" cy="32" r="23"/>
      <circle cx="32" cy="32" r="19"/>
      <circle cx="32" cy="32" r="15"/>
    </g>
    <path d="M11.8 21.2A23 23 0 0 1 21.2 11.8L25.4 19.4A14 14 0 0 0 19.4 25.4Z" fill="#cbd3c9" opacity=".3"/>
    <path d="M52.2 42.8A23 23 0 0 1 42.8 52.2L38.6 44.6A14 14 0 0 0 44.6 38.6Z" fill="#cbd3c9" opacity=".18"/>
    <path d="M32 8A24 24 0 0 1 54 22" fill="none" stroke="#d8ff16" stroke-width="1.5" opacity=".65"/>
    <circle cx="32" cy="8" r="2" fill="#d8ff16"/>
    <circle cx="32" cy="32" r="9" fill="#26300e"/>
    <circle cx="32" cy="32" r="2.5" fill="#090a0a"/>
  </g>
  <ellipse cx="32" cy="32" rx="29" ry="19" transform="rotate(25 32 32)" fill="none" stroke="#d8ff16" stroke-width="2" opacity=".3"/>
  <ellipse cx="32" cy="32" rx="29" ry="19" transform="rotate(-25 32 32)" fill="none" stroke="#d8ff16" stroke-width="2" opacity=".8"/>
  <path d="M17 16H49V24L28 40H49V48H15V40L36 24H17Z" fill="#d8ff16"/>
